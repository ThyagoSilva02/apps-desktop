name: OctoKey Windows x64

on:
  push:
    paths:
      - 'OctoKey/**'
      - '.github/workflows/octokey-windows.yml'
  pull_request:
    paths:
      - 'OctoKey/**'
      - '.github/workflows/octokey-windows.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de uma release OctoKey existente (vazio para apenas compilar e testar)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Compilar, testar e empacotar OctoKey
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: OctoKey
    steps:
      - name: Obter fontes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Preparar MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Compilar Release
        run: cmake --build build --config Release --parallel

      - name: Executar testes
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

      - name: Criar ZIP e hashes SHA256
        run: |
          $version = $env:GITHUB_SHA.Substring(0, 7)
          ./scripts/package-windows.ps1 -Version $version

      - name: Disponibilizar pacote desta compilação
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: MacroPillControl-windows-x64
          path: |
            OctoKey/dist/*.zip
            OctoKey/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Anexar pacote OctoKey à release existente
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obter histórico e tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar pacote desta execução
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: MacroPillControl-windows-x64
          path: dist
          digest-mismatch: error

      - name: Conferir tag, hash e release; anexar arquivos
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^octokey-v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use uma tag como octokey-v1.0.0, sem espaços.'
          }
          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
            throw 'A tag deve existir e apontar exatamente para o commit compilado nesta execução.'
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Crie a release no GitHub antes de anexar o pacote.' }
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Era esperado um único ZIP.' }
          $archive = $archives[0]
          $checksum = Get-Item -LiteralPath 'dist/SHA256SUMS.txt'
          $expected = '{0}  {1}' -f (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $archive.Name
          if ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -ne $expected) {
            throw 'O hash do ZIP não confere.'
          }
          gh release upload $env:RELEASE_TAG $archive.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao anexar; arquivos existentes não são sobrescritos.' }
